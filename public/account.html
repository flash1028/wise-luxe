
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WISE LUXE | My Account</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #080808;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #d6b45a;
        }

        .logo {
            color: #d6b45a;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #d6b45a;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto;
        }

        h1 {
            text-align: center;
            color: #d6b45a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        .box {
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d6b45a;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #080808;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #d6b45a;
            color: #080808;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .switch span {
            color: #d6b45a;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .account-info {
            display: none;
        }

        .account-info p {
            margin-bottom: 18px;
            color: #ddd;
        }

        .account-info strong {
            color: #d6b45a;
        }

        .logout {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">WISE LUXE</div>

    <div>
        <a href="index.html">HOME</a>
        <a href="cart.html">CART</a>
    </div>
</nav>

<div class="container">

    <h1 id="pageTitle">MY ACCOUNT</h1>

    <p class="subtitle" id="pageSubtitle">
        Login to your WISE LUXE account
    </p>

    <div class="box">

        <!-- LOGIN -->
        <div id="loginSection">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >

            <button onclick="login()">LOGIN</button>

            <div class="switch">
                Don't have an account?
                <span onclick="showSignup()">Create Account</span>
            </div>

        </div>


        <!-- SIGNUP -->
        <div id="signupSection" style="display:none;">

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
            >

            <label>Email Address</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
            >

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
            >

            <button onclick="signup()">CREATE ACCOUNT</button>

            <div class="switch">
                Already have an account?
                <span onclick="showLogin()">Login</span>
            </div>

        </div>


        <!-- LOGGED IN -->
        <div id="accountSection" class="account-info">

            <p>
                Welcome,
                <strong id="accountName">Customer</strong>
            </p>

            <p>
                Email:
                <strong id="accountEmail"></strong>
            </p>

            <button class="logout" onclick="logout()">
                LOG OUT
            </button>

        </div>


        <!-- MESSAGE -->
        <div class="message" id="message"></div>

    </div>

</div>


<script>

    /* ================= SUPABASE ================= */

    window.WISE_LUXE_SUPABASE_URL =
        "https://yazonvhwccylehtkkmiz.supabase.co";

    window.WISE_LUXE_SUPABASE_KEY =
        "sb_publishable_8iZT6trE9mWx_vuivWCuug_yg5w984n";

    window.WISE_LUXE_CLIENT =
        window.supabase.createClient(
            window.WISE_LUXE_SUPABASE_URL,
            window.WISE_LUXE_SUPABASE_KEY
        );


    /* ================= MESSAGE ================= */

    function showMessage(text) {

        document.getElementById("message").textContent = text;

    }


    /* ================= REDIRECT ================= */

    function redirectAfterLogin() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const returnPage =
            params.get("return");

        /*
         * If the customer came from checkout,
         * return them to checkout.
         */

        if (returnPage === "checkout") {

            window.location.href =
                "checkout.html";

            return;
        }

        /*
         * Otherwise send them to the
         * WISE LUXE homepage.
         */

        window.location.href =
            "index.html";
    }


    /* ================= SHOW SIGNUP ================= */

    function showSignup() {

        document.getElementById("loginSection").style.display =
            "none";

        document.getElementById("signupSection").style.display =
            "block";

        document.getElementById("accountSection").style.display =
            "none";

        document.getElementById("pageTitle").textContent =
            "CREATE ACCOUNT";

        document.getElementById("pageSubtitle").textContent =
            "Join WISE LUXE and manage your orders anywhere";

        showMessage("");

    }


    /* ================= SHOW LOGIN ================= */

    function showLogin() {

        document.getElementById("signupSection").style.display =
            "none";

        document.getElementById("loginSection").style.display =
            "block";

        document.getElementById("accountSection").style.display =
            "none";

        document.getElementById("pageTitle").textContent =
            "MY ACCOUNT";

        document.getElementById("pageSubtitle").textContent =
            "Login to your WISE LUXE account";

        showMessage("");

    }


    /* ================= SIGNUP ================= */

    async function signup() {

        const name =
            document.getElementById("signupName")
                .value
                .trim();

        const email =
            document.getElementById("signupEmail")
                .value
                .trim();

        const password =
            document.getElementById("signupPassword")
                .value;


        if (!name || !email || !password) {

            showMessage(
                "Please fill in all fields."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters."
            );

            return;
        }


        showMessage(
            "Creating your account..."
        );


        try {

            const result =
                await window.WISE_LUXE_CLIENT.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: name
                        }

                    }

                });


            if (result.error) {

                console.error(
                    "SIGNUP ERROR:",
                    result.error
                );

                showMessage(
                    result.error.message
                );

                return;
            }


            /*
             * If email confirmation is enabled,
             * Supabase creates the account but
             * does not create a login session yet.
             */

            if (
                result.data.user &&
                !result.data.session
            ) {

                showMessage(
                    "Account created. Please check your email to confirm your account."
                );

                return;
            }


            /*
             * If Supabase gives us a session
             * immediately, the customer is logged in.
             */

            showMessage(
                "Account created successfully."
            );


            document.getElementById("signupName").value =
                "";

            document.getElementById("signupEmail").value =
                "";

            document.getElementById("signupPassword").value =
                "";


            await loadAccount();


            /*
             * Send the customer to the correct
             * destination after successful signup.
             */

            setTimeout(function() {

                redirectAfterLogin();

            }, 800);


        } catch (error) {

            console.error(
                "SIGNUP ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Something went wrong. Please try again."
            );

        }

    }


    /* ================= LOGIN ================= */

    async function login() {

        const email =
            document.getElementById("loginEmail")
                .value
                .trim();

        const password =
            document.getElementById("loginPassword")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password."
            );

            return;
        }


        showMessage(
            "Logging in..."
        );


        try {

            const result =
                await window.WISE_LUXE_CLIENT.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (result.error) {

                console.error(
                    "LOGIN ERROR:",
                    result.error
                );

                showMessage(
                    result.error.message
                );

                return;
            }


            /*
             * Login succeeded.
             */

            console.log(
                "LOGIN SESSION:",
                result.data.session
            );


            showMessage(
                "Login successful."
            );


            /*
             * Load the customer's account
             * before redirecting.
             */

            await loadAccount();


            /*
             * Redirect after successful login.
             *
             * checkout.html if the customer came
             * from checkout.
             *
             * index.html for normal login.
             */

            setTimeout(function() {

                redirectAfterLogin();

            }, 800);


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Something went wrong. Please try again."
            );

        }

    }


    /* ================= LOGOUT ================= */

    async function logout() {

        try {

            const result =
                await window.WISE_LUXE_CLIENT.auth
                    .signOut();


            if (result.error) {

                showMessage(
                    result.error.message
                );

                return;
            }


            document.getElementById(
                "accountSection"
            ).style.display = "none";


            document.getElementById(
                "loginSection"
            ).style.display = "block";


            document.getElementById(
                "signupSection"
            ).style.display = "none";


            document.getElementById(
                "pageTitle"
            ).textContent =
                "MY ACCOUNT";


            document.getElementById(
                "pageSubtitle"
            ).textContent =
                "Login to your WISE LUXE account";


            document.getElementById(
                "loginEmail"
            ).value = "";


            document.getElementById(
                "loginPassword"
            ).value = "";


            showMessage(
                "You have been logged out."
            );


        } catch (error) {

            console.error(
                "LOGOUT ERROR:",
                error
            );

            showMessage(
                error.message ||
                "Something went wrong while logging out."
            );

        }

    }


    /* ================= LOAD ACCOUNT ================= */

    async function loadAccount() {

        try {

            const result =
                await window.WISE_LUXE_CLIENT.auth
                    .getUser();


            if (result.error) {

                console.error(
                    "ACCOUNT ERROR:",
                    result.error
                );

                return;
            }


            if (
                !result.data ||
                !result.data.user
            ) {

                return;
            }


            const user =
                result.data.user;


            document.getElementById(
                "loginSection"
            ).style.display =
                "none";


            document.getElementById(
                "signupSection"
            ).style.display =
                "none";


            document.getElementById(
                "accountSection"
            ).style.display =
                "block";


            document.getElementById(
                "pageTitle"
            ).textContent =
                "MY ACCOUNT";


            document.getElementById(
                "pageSubtitle"
            ).textContent =
                "Your WISE LUXE account";


            document.getElementById(
                "accountEmail"
            ).textContent =
                user.email || "";


            document.getElementById(
                "accountName"
            ).textContent =

                user.user_metadata &&
                user.user_metadata.full_name

                    ? user.user_metadata.full_name

                    : "Customer";


        } catch (error) {

            console.error(
                "ACCOUNT ERROR:",
                error
            );

        }

    }


    /* ================= INITIAL CHECK ================= */

    loadAccount();

</script>

</body>
</html>
