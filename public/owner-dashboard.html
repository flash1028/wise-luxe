
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WISE LUXE | Owner Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

/* ================= NAVIGATION ================= */

nav {
    min-height: 85px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    background: #080808;
    border-bottom: 1px solid #292929;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.brand-name {
    color: #d6b45a;
    font-size: 24px;
    letter-spacing: 4px;
}

.owner-label {
    color: #999;
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
}

/* ================= DASHBOARD ================= */

.dashboard {
    max-width: 1200px;
    margin: auto;
    padding: 60px 6%;
}

.page-title {
    margin-bottom: 40px;
}

.page-title h1 {
    font-size: 42px;
    font-weight: normal;
    letter-spacing: 5px;
}

.gold-line {
    width: 80px;
    height: 2px;
    background: #d6b45a;
    margin-top: 20px;
}

/* ================= STATISTICS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 45px;
}

.stat-box {
    background: #111;
    border: 1px solid #292929;
    padding: 25px;
}

.stat-label {
    color: #888;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.stat-number {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: bold;
}

/* ================= ORDERS TITLE ================= */

.orders-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.orders-title h2 {
    font-size: 25px;
    font-weight: normal;
    letter-spacing: 3px;
}

.refresh-button {
    padding: 10px 18px;
    background: transparent;
    border: 1px solid #d6b45a;
    color: #d6b45a;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
}

.refresh-button:hover {
    background: #d6b45a;
    color: #080808;
}

.refresh-button:disabled {
    opacity: 0.5;
    cursor: wait;
}

/* ================= MESSAGE ================= */

.dashboard-message {
    background: #111;
    border: 1px solid #292929;
    padding: 35px 20px;
    text-align: center;
    font-family: Arial, sans-serif;
    color: #888;
    line-height: 1.7;
}

.dashboard-message.error {
    border-color: #633;
    color: #d99;
}

.dashboard-message strong {
    display: block;
    color: #d6b45a;
    font-size: 15px;
    margin-bottom: 8px;
}

/* ================= ORDER CARD ================= */

.order-card {
    background: #111;
    border: 1px solid #292929;
    padding: 30px;
    margin-bottom: 25px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #292929;
}

.order-reference {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
}

.order-status {
    padding: 8px 14px;
    border: 1px solid #d6b45a;
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    white-space: nowrap;
}

.order-status.delivered {
    background: #d6b45a;
    color: #080808;
}

.order-date {
    color: #777;
    font-family: Arial, sans-serif;
    font-size: 11px;
    margin: 15px 0 20px;
    line-height: 1.7;
}

/* ================= CUSTOMER ================= */

.customer-box {
    background: #080808;
    border: 1px solid #292929;
    padding: 20px;
    margin-bottom: 20px;
}

.customer-title {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.customer-details {
    color: #ccc;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.9;
    word-break: break-word;
}

.customer-details strong {
    color: #fff;
}

/* ================= PRODUCTS ================= */

.product {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid #292929;
}

.product-image {
    width: 80px;
    height: 100px;
    overflow: hidden;
    background: #222;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-name {
    font-size: 16px;
    margin-bottom: 7px;
}

.product-code {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 7px;
}

.product-details {
    color: #888;
    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1.7;
}

.product-price {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

/* ================= ORDER BOTTOM ================= */

.order-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 20px;
    margin-top: 10px;
    gap: 20px;
}

.order-total {
    color: #d6b45a;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
}

/* ================= DELIVER BUTTON ================= */

.delivered-button {
    padding: 13px 22px;
    background: #d6b45a;
    color: #080808;
    border: none;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.5px;
    transition: 0.3s;
}

.delivered-button:hover {
    background: white;
}

.delivered-button:disabled {
    background: #333;
    color: #777;
    cursor: default;
}

/* ================= EMPTY ================= */

.empty-orders {
    background: #111;
    border: 1px solid #292929;
    padding: 70px 20px;
    text-align: center;
}

.empty-orders h2 {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 12px;
}

.empty-orders p {
    color: #777;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    nav {
        min-height: 70px;
        padding: 0 5%;
    }

    .brand img {
        width: 45px;
        height: 45px;
    }

    .brand-name {
        font-size: 18px;
        letter-spacing: 2px;
    }

    .owner-label {
        display: none;
    }

    .dashboard {
        padding: 45px 5%;
    }

    .page-title h1 {
        font-size: 30px;
        letter-spacing: 3px;
    }

    .stats {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .orders-title {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
    }

    .order-card {
        padding: 20px;
    }

    .order-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .product {
        grid-template-columns: 65px 1fr;
        gap: 13px;
    }

    .product-image {
        width: 65px;
        height: 85px;
    }

    .product-price {
        grid-column: 2;
    }

    .order-bottom {
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
    }

    .delivered-button {
        width: 100%;
    }

}

</style>

</head>

<body>

<nav>

    <div class="brand">

        <img
            src="images/logo.png"
            alt="WISE LUXE"
        >

        <div class="brand-name">
            WISE LUXE
        </div>

    </div>

    <div class="owner-label">
        OWNER DASHBOARD
    </div>

</nav>


<main class="dashboard">

    <div class="page-title">

        <h1>
            OWNER DASHBOARD
        </h1>

        <div class="gold-line"></div>

    </div>


    <!-- ================= STATISTICS ================= -->

    <div class="stats">

        <div class="stat-box">

            <div class="stat-label">
                TOTAL ORDERS
            </div>

            <div
                class="stat-number"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat-box">

            <div class="stat-label">
                ORDERS RECEIVED
            </div>

            <div
                class="stat-number"
                id="receivedOrders"
            >
                0
            </div>

        </div>


        <div class="stat-box">

            <div class="stat-label">
                DELIVERED
            </div>

            <div
                class="stat-number"
                id="deliveredOrders"
            >
                0
            </div>

        </div>

    </div>


    <!-- ================= ORDERS ================= -->

    <div class="orders-title">

        <h2>
            CUSTOMER ORDERS
        </h2>

        <button
            class="refresh-button"
            id="refreshButton"
            onclick="loadOrders()"
        >
            ↻ REFRESH
        </button>

    </div>


    <div id="ordersContainer"></div>

</main>


<script>

/* =========================================================
   SERVER API
========================================================= */

const API_URL = "/api/orders";


/* =========================================================
   GET ORDERS FROM NODE.JS SERVER
========================================================= */

async function getOrders() {

    const response = await fetch(
        API_URL + "?t=" + Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    );


    if (!response.ok) {

        throw new Error(
            "Server returned HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        !data ||
        data.success !== true
    ) {

        throw new Error(
            data.message ||
            "The server did not return orders."
        );

    }


    return Array.isArray(data.orders)
        ? data.orders
        : [];

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStatistics(orders) {

    const total =
        orders.length;


    const received =
        orders.filter(function(order) {

            return String(
                order.status || ""
            ).toUpperCase() ===
            "ORDER RECEIVED";

        }).length;


    const delivered =
        orders.filter(function(order) {

            return String(
                order.status || ""
            ).toUpperCase() ===
            "DELIVERED";

        }).length;


    document.getElementById(
        "totalOrders"
    ).textContent = total;


    document.getElementById(
        "receivedOrders"
    ).textContent = received;


    document.getElementById(
        "deliveredOrders"
    ).textContent = delivered;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   MARK ORDER AS DELIVERED
========================================================= */

async function markDelivered(orderNumber) {

    const confirmed =
        confirm(
            "Mark order " +
            orderNumber +
            " as DELIVERED?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/orders/" +
                encodeURIComponent(
                    orderNumber
                ),
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: "DELIVERED"
                    })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Could not update order."
            );

        }


        if (!result.success) {

            throw new Error(
                result.message ||
                "Could not update order."
            );

        }


        await loadOrders();


        alert(
            "Order " +
            orderNumber +
            " has been marked as DELIVERED."
        );


    } catch (error) {

        console.error(
            "DELIVERY UPDATE ERROR:",
            error
        );


        alert(
            "Could not update this order.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   DISPLAY ORDERS
========================================================= */

function displayOrders(orders) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = "";


    /* ================= NO ORDERS ================= */

    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <h2>
                    No orders yet
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    /* ================= DISPLAY ORDERS ================= */

    orders.forEach(function(order) {

        const orderCard =
            document.createElement("div");


        orderCard.className =
            "order-card";


        const customer =
            order.customer || {};


        let productsHTML = "";


        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        items.forEach(function(item) {

            const price =
                Number(item.price || 0);


            const quantity =
                Number(item.quantity || 1);


            const subtotal =
                price * quantity;


            const productName =
                escapeHTML(
                    item.name ||
                    "Product"
                );


            const productCode =
                escapeHTML(
                    item.productCode ||
                    "WL-P000"
                );


            const productType =
                escapeHTML(
                    item.type ||
                    "N/A"
                );


            const productSize =
                escapeHTML(
                    item.size ||
                    "N/A"
                );


            const image =
                escapeHTML(
                    item.image ||
                    ""
                );


            productsHTML += `

                <div class="product">

                    <div class="product-image">

                        ${
                            image
                            ? `
                                <img
                                    src="${image}"
                                    alt="${productName}"
                                    onerror="this.style.display='none'"
                                >
                              `
                            : ""
                        }

                    </div>


                    <div>

                        <div class="product-name">
                            ${productName}
                        </div>


                        <div class="product-code">

                            PRODUCT CODE:
                            ${productCode}

                        </div>


                        <div class="product-details">

                            Type:
                            ${productType}

                            <br>

                            Size:
                            ${productSize}

                            <br>

                            Quantity:
                            ${quantity}

                            <br>

                            Price:
                            ₦${price.toLocaleString()}

                        </div>

                    </div>


                    <div class="product-price">

                        ₦${subtotal.toLocaleString()}

                    </div>

                </div>

            `;

        });


        /* ================= STATUS ================= */

        const isDelivered =
            String(
                order.status || ""
            ).toUpperCase() ===
            "DELIVERED";


        const statusClass =
            isDelivered
                ? "order-status delivered"
                : "order-status";


        const statusText =
            isDelivered
                ? "DELIVERED"
                : "ORDER RECEIVED";


        /* ================= BUTTON ================= */

        const buttonHTML =
            isDelivered

                ? `

                    <button
                        class="delivered-button"
                        disabled
                    >
                        ✓ DELIVERED
                    </button>

                  `

                : `

                    <button
                        class="delivered-button"
                        onclick="markDelivered('${escapeHTML(
                            order.orderNumber || ""
                        )}')"
                    >
                        MARK AS DELIVERED
                    </button>

                  `;


        /* ================= ORDER CARD ================= */

        orderCard.innerHTML = `

            <div class="order-header">

                <div class="order-reference">

                    ORDER REFERENCE:

                    ${escapeHTML(
                        order.orderNumber ||
                        "N/A"
                    )}

                </div>


                <div class="${statusClass}">

                    ${statusText}

                </div>

            </div>


            <div class="order-date">

                ORDER DATE:

                ${escapeHTML(
                    order.date ||
                    "N/A"
                )}

                ${
                    isDelivered &&
                    order.deliveredDate

                        ? `

                            <br>

                            DELIVERED:

                            ${escapeHTML(
                                order.deliveredDate
                            )}

                          `

                        : ""
                }

            </div>


            <!-- CUSTOMER INFORMATION -->

            <div class="customer-box">

                <div class="customer-title">

                    CUSTOMER INFORMATION

                </div>


                <div class="customer-details">

                    <strong>Name:</strong>

                    ${escapeHTML(
                        customer.name ||
                        "Not available"
                    )}

                    <br>


                    <strong>Phone:</strong>

                    ${escapeHTML(
                        customer.phone ||
                        "Not available"
                    )}

                    <br>


                    <strong>Email:</strong>

                    ${escapeHTML(
                        customer.email ||
                        "Not available"
                    )}

                    <br>


                    <strong>Address:</strong>

                    ${escapeHTML(
                        customer.address ||
                        "Not available"
                    )}

                    <br>


                    <strong>City:</strong>

                    ${escapeHTML(
                        customer.city ||
                        "Not available"
                    )}

                    <br>


                    <strong>State:</strong>

                    ${escapeHTML(
                        customer.state ||
                        "Not available"
                    )}

                </div>

            </div>


            <!-- PRODUCTS -->

            ${productsHTML}


            <!-- TOTAL -->

            <div class="order-bottom">

                <div class="order-total">

                    TOTAL:

                    ₦${Number(
                        order.total || 0
                    ).toLocaleString()}

                </div>


                ${buttonHTML}

            </div>

        `;


        container.appendChild(
            orderCard
        );

    });

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const refreshButton =
        document.getElementById(
            "refreshButton"
        );


    refreshButton.disabled =
        true;


    refreshButton.textContent =
        "↻ LOADING...";


    container.innerHTML = `

        <div class="dashboard-message">

            <strong>
                LOADING ORDERS
            </strong>

            Connecting to WISE LUXE server...

        </div>

    `;


    try {

        const orders =
            await getOrders();


        updateStatistics(
            orders
        );


        displayOrders(
            orders
        );


    } catch (error) {

        console.error(
            "ORDER LOAD ERROR:",
            error
        );


        document.getElementById(
            "totalOrders"
        ).textContent = "0";


        document.getElementById(
            "receivedOrders"
        ).textContent = "0";


        document.getElementById(
            "deliveredOrders"
        ).textContent = "0";


        container.innerHTML = `

            <div class="dashboard-message error">

                <strong>
                    UNABLE TO LOAD ORDERS
                </strong>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                The WISE LUXE server must be running
                and this dashboard must be opened from:

                <br><br>

                <b>
                    http://localhost:3000
                </b>

                <br><br>

                Then click REFRESH.

            </div>

        `;

    } finally {

        refreshButton.disabled =
            false;


        refreshButton.textContent =
            "↻ REFRESH";

    }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    function() {

        loadOrders();

    },
    10000
);


/* =========================================================
   START DASHBOARD
========================================================= */

loadOrders();

</script>

</body>

</html>
